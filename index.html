<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forever Dashboard</title>
</head>
<body>
    <h1>⏳ Forever Automation Dashboard</h1>
    <div id="status"></div>

    <h2>💾 Storage Overview</h2>
<button id="refresh-storage">Refresh Storage Data</button>
<div id="storage-overview"></div>

<script>
async function loadStorage() {
  try {
    const res = await fetch("./storage.json?cachebust=" + new Date().getTime());
    const data = await res.json();
    const table = `<table border="1" cellpadding="4">
      <tr><th>Storage Option</th><th>Max Storage</th><th>Used Storage</th><th>Notes</th></tr>
      ${data.storage_options.map(opt => `
        <tr>
          <td>${opt.name}</td>
          <td>${opt.max_storage}</td>
          <td>${opt.used_storage}</td>
          <td>${opt.notes}</td>
        </tr>
      `).join("")}
    </table>`;
    document.getElementById("storage-overview").innerHTML = table;
  } catch (err) {
    document.getElementById("storage-overview").innerHTML = "<p>Error loading storage info.</p>";
    console.error(err);
  }
}

// initial load
loadStorage();

// refresh button
document.getElementById("refresh-storage").addEventListener("click", loadStorage);
</script>

    <script>
        // Relative path to JSON, no username or repo hard-coded
        const url = "./status.json";

        fetch(url)
            .then(res => res.json())
            .then(data => {
                document.getElementById("status").innerHTML = `
                    <p><strong>Last Run:</strong> ${data.timestamp}</p>
                    <p><strong>Status:</strong> ${data.status}</p>
                    <p><strong>Records Collected:</strong> ${data.records_collected}</p>
                `;
            })
            .catch(err => {
                document.getElementById("status").innerHTML = "<p>Error loading data.</p>";
                console.error(err);
            });
    </script>
</body>
</html>
