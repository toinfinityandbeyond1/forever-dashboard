name: Run Scraper Daily
on:
  schedule:
    - cron: '0 3 * * *'  # daily at 3AM UTC
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scripts/scraper.py

      - name: Copy JSON to dashboard folder
        run: cp data/status.json dashboard/status.json

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/status.json dashboard/status.json
          git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M:%S')" || echo "No changes"
          git push
